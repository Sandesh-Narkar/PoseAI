<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercises — PoseAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = { darkMode: "class", theme: { extend: {
      colors: { "primary":"#006194","on-primary":"#ffffff","primary-container":"#007bb9","on-primary-container":"#fdfcff","primary-fixed":"#cce5ff","primary-fixed-dim":"#93ccff","secondary":"#006c49","on-secondary":"#ffffff","secondary-container":"#6cf8bb","on-secondary-container":"#00714d","secondary-fixed":"#6ffbbe","secondary-fixed-dim":"#4edea3","tertiary":"#825100","on-tertiary":"#ffffff","tertiary-container":"#a36700","on-tertiary-container":"#fffbff","tertiary-fixed":"#ffddb8","tertiary-fixed-dim":"#ffb95f","on-tertiary-fixed":"#2a1700","on-tertiary-fixed-variant":"#653e00","error":"#ba1a1a","on-error":"#ffffff","error-container":"#ffdad6","on-error-container":"#93000a","surface":"#faf8ff","on-surface":"#131b2e","surface-variant":"#dae2fd","on-surface-variant":"#3f4850","outline":"#707881","outline-variant":"#bfc7d2","surface-container-lowest":"#ffffff","surface-container-low":"#f2f3ff","surface-container":"#eaedff","surface-container-high":"#e2e7ff","surface-container-highest":"#dae2fd","surface-dim":"#d2d9f4","surface-bright":"#faf8ff","background":"#faf8ff","inverse-surface":"#283044","inverse-on-surface":"#eef0ff","inverse-primary":"#93ccff","surface-tint":"#006398" },
      borderRadius: { DEFAULT: "1rem", lg: "2rem", xl: "3rem", full: "9999px" },
      fontFamily: { sans: ["Plus Jakarta Sans", "ui-sans-serif", "system-ui"] }
    } } };
  </script>
  <style>
    body { font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui; }
    ::-webkit-scrollbar { display: none; }
  </style>
  <link rel="stylesheet" href="/css/navbar.css">
</head>

<body data-page="exercises" class="bg-background min-h-screen antialiased flex flex-col">
  <div id="app-header"></div>

  <main class="w-full pt-20 bg-background flex-1">
    <div class="max-w-7xl mx-auto px-4 md:px-10 py-6 md:py-10">
      <div class="flex flex-col w-full gap-6">

        <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-2">
          <div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-on-surface">Exercise Library</h1>
            <p class="text-sm text-on-surface-variant mt-1">Exercises supported by the PoseAI CV engine.</p>
          </div>
          <span id="exerciseCount" class="self-start md:self-auto px-3 py-1 rounded-full bg-surface-container-lowest shadow-sm text-sm font-semibold text-on-surface-variant"></span>
        </div>

        <div id="exerciseGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <div class="sm:col-span-2 lg:col-span-3 flex items-center justify-center py-20 text-on-surface-variant">
            <span class="material-symbols-outlined animate-spin text-3xl mr-2">progress_activity</span> Loading exercises…
          </div>
        </div>

      </div>
    </div>
  </main>

  <div id="app-footer"></div>
  <script src="js/shell.js"></script>
  <script>
    "use strict";

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    async function load() {
      const grid = document.getElementById("exerciseGrid");
      try {
        const res = await window.api.get("/api/exercises");
        const exercises = res.data || [];
        document.getElementById("exerciseCount").textContent = exercises.length + " exercises available";
        grid.innerHTML = "";
        if (!exercises.length) {
          grid.innerHTML = '<p class="col-span-3 text-center text-on-surface-variant py-16">No exercises available.</p>';
          return;
        }
        exercises.forEach(function (ex) {
          const card = document.createElement("article");
          card.className = "bg-surface-container-lowest rounded-3xl p-5 shadow-sm flex flex-col";
          card.innerHTML =
            '<div class="w-11 h-11 rounded-2xl bg-primary-fixed text-primary flex items-center justify-center mb-3">' +
            '<span class="material-symbols-outlined text-[22px]">fitness_center</span></div>' +
            '<h2 class="text-lg font-bold text-on-surface">' + escapeHtml(ex.name) + "</h2>" +
            '<p class="text-sm text-on-surface-variant mt-1 flex-1">' + escapeHtml(ex.description || "") + "</p>" +
            '<div class="mt-3 flex flex-wrap gap-1">' +
            (ex.muscles || []).map(function (m) {
              return '<span class="px-2 py-0.5 rounded-full bg-surface-container-low text-[11px] font-medium text-on-surface-variant">' + escapeHtml(m) + "</span>";
            }).join("") +
            "</div>" +
            '<a class="mt-4 inline-flex items-center justify-center gap-2 px-4 py-2 rounded-full bg-primary hover:bg-primary-container text-on-primary text-sm font-bold transition-all" href="/workout?exercise=' + encodeURIComponent(ex.id) + '">' +
            '<span class="material-symbols-outlined text-[18px]">play_arrow</span>START WORKOUT</a>';
          grid.appendChild(card);
        });
      } catch (err) {
        grid.innerHTML = '<p class="col-span-3 text-center text-error py-16">Failed to load exercises: ' + escapeHtml(err.message) + "</p>";
      }
    }

    document.addEventListener("DOMContentLoaded", load);
  </script>

</body>

</html>
