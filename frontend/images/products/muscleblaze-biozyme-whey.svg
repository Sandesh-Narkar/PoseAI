<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <radialGradient id="studio-light" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <radialGradient id="soft-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.28)"/>
      <stop offset="60%" stop-color="rgba(15, 23, 42, 0.10)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0)"/>
    </radialGradient>
    <filter id="blur-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="400" height="320" fill="url(#studio-light)"/>
  <ellipse cx="200" cy="275" rx="100" ry="18" fill="url(#soft-shadow)" filter="url(#blur-shadow)"/>
  
      <g transform="translate(130, 45)">
        <!-- Black Lid -->
        <rect x="25" y="10" width="90" height="28" rx="6" fill="#1e293b"/>
        <line x1="25" y1="24" x2="115" y2="24" stroke="#334155" stroke-width="2"/>
        <!-- Blue Tub Body -->
        <rect x="15" y="36" width="110" height="185" rx="20" fill="#0f3b6c"/>
        <path d="M15 50 Q70 65 125 50 L125 185 Q70 200 15 185 Z" fill="#174e8c" opacity="0.6"/>
        <!-- Label Area -->
        <rect x="20" y="65" width="100" height="135" rx="8" fill="#091b36"/>
        <rect x="25" y="70" width="90" height="6" fill="#0284c7"/>
        <text x="70" y="92" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">MUSCLEBLAZE</text>
        <text x="70" y="112" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" text-anchor="middle">BIOZYME</text>
        <text x="70" y="126" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">PERFORMANCE WHEY</text>
        <!-- Highlight badge -->
        <rect x="35" y="140" width="70" height="18" rx="4" fill="#0284c7"/>
        <text x="70" y="152" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" text-anchor="middle">25g PROTEIN • 2KG</text>
        <!-- Gold seal -->
        <circle cx="70" cy="180" r="10" fill="#eab308"/>
        <text x="70" y="183" fill="#713f12" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="900" text-anchor="middle">LABDOOR</text>
      </g>
    
</svg>