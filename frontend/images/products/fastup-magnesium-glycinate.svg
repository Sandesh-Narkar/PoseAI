<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <radialGradient id="studio-light" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <radialGradient id="soft-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.28)"/>
      <stop offset="60%" stop-color="rgba(15, 23, 42, 0.10)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0)"/>
    </radialGradient>
    <filter id="blur-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="400" height="320" fill="url(#studio-light)"/>
  <ellipse cx="200" cy="275" rx="100" ry="18" fill="url(#soft-shadow)" filter="url(#blur-shadow)"/>
  
      <g transform="translate(140, 50)">
        <rect x="25" y="10" width="50" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <rect x="18" y="28" width="64" height="160" rx="12" fill="#451a03"/>
        <rect x="22" y="55" width="56" height="110" rx="6" fill="#15803d"/>
        <text x="50" y="75" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="900" text-anchor="middle">FAST&amp;UP</text>
        <text x="50" y="95" fill="#fef08a" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle">MAGNESIO</text>
        <text x="50" y="112" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">GLYCINATE</text>
        <text x="50" y="140" fill="#bbf7d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" text-anchor="middle">60 CAPS</text>
      </g>
    
</svg>