        <circle cx="59" cy="140" r="8" fill="#22c55e"/>
        <text x="80" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="900">HYPERVOLT</text>
      </g>
    
</svg>